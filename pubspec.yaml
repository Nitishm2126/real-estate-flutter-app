name: mcp_avadi
description: "MCP Avadi – Premium Enterprise CRM for Madras City Properties, Avadi Branch."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Formatting (dates, phone display, etc.)
  intl: ^0.19.0

  # Launching phone dialer / WhatsApp
  url_launcher: ^6.2.6

  # Premium entrance / list / micro animations
  flutter_animate: ^4.5.0

  # Typography
  google_fonts: ^6.2.1

  # Networking – Supabase integration
  supabase_flutter: ^2.5.4

  # Shimmer loading skeleton
  shimmer: ^3.0.0

  # PDF generation
  pdf: ^3.11.0

  # In-app PDF viewer + download + share (Android, Windows, Web)
  printing: ^5.13.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/photo.png
